[workspace]
resolver = "2"
members = [
  "crates/filc",
  "crates/filc-build",
  "crates/filc-macros",
  "examples/counter",
]

[workspace.package]
edition = "2024"
categories = ["api-bindings", "development-tools::ffi"]
keywords = ["fil-c", "ffi", "memory-safety", "c", "code-generation"]
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
